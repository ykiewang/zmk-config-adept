# Boost BLE signal
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Zmk studio
CONFIG_ZMK_STUDIO_LOCKING=n

# Bluetooth latency between peripherals. Higher value means more latency, but conserves battery.
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Enable support to control external power output
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=16

# Windows battery reporting issue workaround
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Decrease chatter; increase latency, but increase stability
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# Show peripheral battery. @Bravekarma said putting this in central conf is enough.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Enable the Bluetooth BAS (battery reporting service)
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=1
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=50
# n!n clone's chip antenna can only transmit at 125hz, which is once per 8ms
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000

CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# From zmk-pointing-acceleration-alpha. Enable the acceleration module.
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
# Choose your level (1 or 2)
# CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_SIMPLE=y      # Level 1: Simple
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_STANDARD=y  # Level 2: Standard
# CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_GAMING_LASER=y       # Gaming laser mouse
# CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_OFFICE_OPTICAL=y   # Office optical mouse
# CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_HIGH_SENS_TRACKBALL=y # High sensitivity trackball
CONFIG_INPUT_PROCESSOR_ACCEL_PRESET_CUSTOM=y

# @efogdev's trackball surface quality tests for pmw3610
# logs surface quality, debug level, use only for debugging because it will prevent the sensor from going to sleep
# CONFIG_LOG_MAX_LEVEL=4
# CONFIG_PMW3610_SQUAL_LOG=y
# surface quality log interval, msec
CONFIG_PMW3610_SQUAL_LOG_INTERVAL=250
# ignore first N events after boot to avoid warping
CONFIG_PMW3610_IGNORE_FIRST_N=12
# ignore first events after rest too
CONFIG_PMW3610_IGNORE_AFTER_REST=y

# ─── zmk-module-runtime-input-processor 集成 ───
# 主开关（会自动 select CONFIG_ZMK_CUSTOM_SETTINGS）
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
# Studio 保持启用（用于 keymap 编辑等原生功能）
CONFIG_ZMK_STUDIO=y
# Web UI 的 Custom Studio RPC 启用：
# 根因：Zephyr 的 modules/nanopb/nanopb.cmake 里 include_guard(GLOBAL) 让
# FindNanopb.cmake 的 `if(NOT DEFINED) set(APPEND_PATH TRUE)` 只在首个
# include(nanopb) 的 add_subdirectory 子作用域里生效；出了子作用域这个默认
# TRUE 就没了；zmk main app 后续 include(nanopb) 被 guard 跳过，
# APPEND_PATH 变 undefined，nanopb_generate_cpp 走 else 分支缺失
# `-I .../proto/zmk`，protoc 报 import "meta.proto" not found。
# 解决：在 build.yaml 里通过 `-DNANOPB_GENERATE_CPP_APPEND_PATH=TRUE`
# 把它提升为 CACHE 变量，跨作用域全局可见（等效于把 nanopb.cmake 的
# 默认值提前到全局）。
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
# 抬 low-priority thread 栈（模块 README 明确要求，即便不启 Web UI 也建议留着）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
