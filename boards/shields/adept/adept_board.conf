# zmk-keybeacon: report layer (name + index), modifier state, host/profile
# connection status and battery over the host BLE connection.
#
# Adept is a unibody (non-split) board, so this half IS the host-link role:
# CONFIG_ZMK_SPLIT is unset and the module links (its guard accepts
# `NOT CONFIG_ZMK_SPLIT OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL`, zmk-keybeacon
# >= v1.2.1). This file lives next to the shield so it applies to the
# adept_board image only — the settings_reset image stays clean.
CONFIG_ZMK_KEYBEACON=y

# KBP 1.1 sub-options (both default y upstream; listed to document that this
# config relies on them). CONNECTIVITY emits host connection / profile /
# output-endpoint state on AA2; BATTERY emits the pack level on AA3.
CONFIG_ZMK_KEYBEACON_CONNECTIVITY=y
CONFIG_ZMK_KEYBEACON_BATTERY=y

# KBP 1.2 sub-option (zmk-keybeacon >= v1.2.0): per-connection Host-Link
# characteristic AA4, so each bonded host learns its OWN profile slot and can
# tell "in use on this computer" from "active on another computer".
CONFIG_ZMK_KEYBEACON_HOST_LINK=y
